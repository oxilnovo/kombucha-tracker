<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8fa8b8">
  <meta name="description" content="Suivi partagé des fermentations de kombucha">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>Kombucha Tracker</title>
</head>
<body>
  <header class="topbar">
    <div class="brand-wrap">
      <div class="brand-icon">🫙</div>
      <div><div class="eyebrow">KOMBUCHA</div><h1>Tracker</h1></div>
    </div>
    <button id="installBtn" class="ghost-btn hidden" type="button">Installer</button>
  </header>

  <main class="app-main">
    <div id="connectionBanner" class="banner info">Connexion aux données…</div>

    <section id="page-active" class="page active-page">
      <div class="page-title-row">
        <div><div class="kicker">EN COURS</div><h2>Mes batchs</h2></div>
        <button id="refreshBtn" class="soft-btn" type="button">↻</button>
      </div>
      <div id="activeList" class="card-grid"></div>
    </section>

    <section id="page-completed" class="page">
      <div class="page-title-row">
        <div><div class="kicker">HISTORIQUE</div><h2>Batchs terminés</h2></div>
      </div>
      <div id="completedList" class="card-grid"></div>
    </section>

    <section id="page-settings" class="page">
      <div class="page-title-row"><div><div class="kicker">PERSONNALISATION</div><h2>Settings</h2></div></div>
      <div class="settings-card">
        <form id="settingsForm" class="form-grid">
          <label><span>Durée par défaut F1 (jours)</span><input id="defaultF1" type="number" min="1" max="365" step="1" required></label>
          <label><span>Durée par défaut F2 (jours)</span><input id="defaultF2" type="number" min="1" max="60" step="1" required></label>
          <div class="wide actions"><button class="primary-btn" type="submit">Enregistrer les settings</button></div>
        </form>
      </div>
    </section>
  </main>

  <button id="addBtn" class="fab-add" type="button" aria-label="Ajouter un batch"><span>+</span><small>1</small></button>

  <nav class="bottom-nav" aria-label="Navigation">
    <button class="nav-btn active" data-page="active"><span>🫙</span><small>Mes batchs</small></button>
    <div class="nav-spacer"></div>
    <button class="nav-btn" data-page="completed"><span>✓</span><small>Terminés</small></button>
    <button class="nav-btn" data-page="settings"><span>⚙</span><small>Settings</small></button>
  </nav>

  <template id="emptyTemplate"><div class="empty-state"><div class="empty-icon">🫙</div><strong>Aucun batch en cours</strong><span>Utilisez le bouton +1 pour démarrer votre prochaine fermentation.</span></div></template>

  <div id="batchModal" class="modal hidden" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="batchModalTitle">
      <div class="modal-header"><div><div class="kicker">BATCH</div><h2 id="batchModalTitle">Nouveau batch</h2></div><button id="closeBatchModal" class="icon-btn" type="button">×</button></div>
      <form id="batchForm" class="form-grid">
        <input id="batchId" type="hidden">
        <input id="batchPhase" type="hidden" value="F1">
        <label><span>Nom</span><input id="batchName" required maxlength="80" placeholder="Ex. Gingembre #12"></label>
        <label><span>Durée F1 (jours)</span><input id="batchF1Days" type="number" min="1" max="365" step="1" required></label>
        <label><span>Litres</span><input id="batchLiters" type="number" min="0.1" max="500" step="0.1" placeholder="2"></label>
        <label><span>Thé (g)</span><input id="batchTeaGrams" type="number" min="0" max="10000" step="1" placeholder="20"></label>
        <label><span>Sucre (g)</span><input id="batchSugarGrams" type="number" min="0" max="10000" step="1" placeholder="120"></label>
        <label><span>Prolonger de (jours)</span><input id="extendDays" type="number" min="0" max="365" step="1" value="0"></label>
        <label class="wide"><span>Notes</span><textarea id="batchNotes" maxlength="500" placeholder="Observations, conditions, recette…"></textarea></label>
        <div class="wide actions"><button class="primary-btn" type="submit" id="batchSubmit">Démarrer la F1</button></div>
      </form>
    </div>
  </div>

  <div id="f2Modal" class="modal hidden" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="f2ModalTitle">
      <div class="modal-header"><div><div class="kicker">DEUXIÈME FERMENTATION</div><h2 id="f2ModalTitle">Passer en F2</h2></div><button id="closeF2Modal" class="icon-btn" type="button">×</button></div>
      <form id="f2Form" class="form-grid">
        <input id="f2BatchId" type="hidden">
        <label><span>Durée F2 (jours)</span><input id="f2Days" type="number" min="1" max="60" step="1" required></label>
        <label><span>Litres</span><input id="f2Liters" type="number" min="0.1" max="500" step="0.1" required></label>
        <label><span>Thé (g)</span><input id="f2TeaGrams" type="number" min="0" max="10000" step="1"></label>
        <label><span>Sucre (g)</span><input id="f2SugarGrams" type="number" min="0" max="10000" step="1"></label>
        <label><span>Parfum</span><input id="f2Flavor" maxlength="120" placeholder="Ex. gingembre-citron"></label>
        <label><span>Prolonger de (jours)</span><input id="f2ExtendDays" type="number" min="0" max="60" step="1" value="0"></label>
        <label class="wide"><span>Notes</span><textarea id="f2Notes" maxlength="500" placeholder="Mise en bouteille, parfum, température…"></textarea></label>
        <div class="wide actions"><button class="primary-btn" type="submit">Démarrer la F2</button></div>
      </form>
    </div>
  </div>

  <div id="editModal" class="modal hidden" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
      <div class="modal-header"><div><div class="kicker">MODIFIER</div><h2 id="editModalTitle">Modifier le batch</h2></div><button id="closeEditModal" class="icon-btn" type="button">×</button></div>
      <form id="editForm" class="form-grid">
        <input id="editId" type="hidden">
        <input id="editPhase" type="hidden">
        <label><span>Nom</span><input id="editName" required maxlength="80"></label>
        <label><span>Durée (jours)</span><input id="editDays" type="number" min="1" max="365" required></label>
        <label><span>Litres</span><input id="editLiters" type="number" min="0.1" max="500" step="0.1"></label>
        <label><span>Thé (g)</span><input id="editTeaGrams" type="number" min="0" max="10000" step="1"></label>
        <label><span>Sucre (g)</span><input id="editSugarGrams" type="number" min="0" max="10000" step="1"></label>
        <label id="editFlavorWrap"><span>Parfum</span><input id="editFlavor" maxlength="120"></label>
        <label class="wide"><span>Prolonger de (jours)</span><input id="editExtendDays" type="number" min="0" max="365" step="1" value="0"></label>
        <label class="wide"><span>Notes</span><textarea id="editNotes" maxlength="500"></textarea></label>
        <div class="wide actions"><button class="primary-btn" type="submit">Enregistrer les modifications</button></div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>
  <script src="config.js"></script><script src="app.js"></script>
</body>
</html>
